<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Zombie Assault Prototype v1.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Zombie game"></canvas>

  <div id="hud">
    <div class="top-left">
      <div class="stat"><span>HP</span><div class="bar"><i id="hpBar"></i></div><b id="hpText">100</b></div>
      <div class="stat"><span>ARMOUR</span><div class="bar armour"><i id="armourBar"></i></div><b id="armourText">50</b></div>
    </div>
    <div class="top-center">
      <div id="waveText">WAVE 1</div>
      <small id="zombieText">ZOMBIES 0</small>
    </div>
    <div class="top-right">
      <div id="weaponText">PISTOL</div>
      <div id="ammoText">12 / ∞</div>
    </div>
    <div id="message"></div>
  </div>

  <div id="mobileControls">
    <div id="moveStick" class="stick"><div class="knob"></div></div>
    <div id="aimStick" class="stick"><div class="knob"></div></div>
    <button id="reloadBtn" class="action">↻</button>
    <button id="grenadeBtn" class="action">G</button>
  </div>

  <div id="desktopHelp">WASD / arrows: move · mouse: aim · click: fire · R: reload · G: grenade</div>
  <div id="startOverlay">
    <h1>DEADLINE</h1>
    <p>Wave-defense prototype</p>
    <button id="startBtn">START</button>
    <small>Built for iPhone touch testing</small>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
